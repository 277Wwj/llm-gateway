[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-gateway-demo"
version = "0.1.0"
description = "Single-worker asynchronous LLM reliability gateway"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.165.0", "uvicorn==0.54.0", "httpx==0.28.1", "pydantic==2.14.3", "pydantic-settings==2.16.3", "redis>=5,<8", "prometheus-client>=0.21,<1"]

[project.optional-dependencies]
test = ["pytest==9.2.0", "pytest-asyncio>=1,<2"]

[tool.setuptools.packages.find]
include = ["gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
